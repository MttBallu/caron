name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Check types
        run: uv run mypy caron tests examples
      - name: Run unit and invariant tests
        run: uv run pytest
      - name: Run semantic example
        run: uv run python -m examples.semantic_spine
      - name: Verify generated viewer
        run: |
          uv run python -m examples.cytoscape_html
          git diff --exit-code -- examples/career_graph.html
      - name: Build distributions
        run: uv build
